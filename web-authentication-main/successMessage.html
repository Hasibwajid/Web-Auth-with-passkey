<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Successfully Logged In</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f06, #4a90e2);
            color: white;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        h1 {
            font-size: 2rem;
            color: #fff;
            position: relative;
            animation: fadeIn 2s ease-in-out, moveUp 2s ease-in-out;
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes moveUp {
            0% { transform: translateY(20px); }
            100% { transform: translateY(0); }
        }
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 50px;
            height: 70px;
            background: red;
            border-radius: 50%;
            animation: balloon 5s infinite;
        }
        .balloon:before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            width: 2px;
            height: 30px;
            background: white;
        }
        .balloon:nth-child(1) { left: 10%; animation-duration: 4s; }
        .balloon:nth-child(2) { left: 20%; animation-duration: 6s; }
        .balloon:nth-child(3) { left: 30%; animation-duration: 5s; }
        .balloon:nth-child(4) { left: 40%; animation-duration: 7s; }
        .balloon:nth-child(5) { left: 50%; animation-duration: 6s; }
        .balloon:nth-child(6) { left: 60%; animation-duration: 4s; }
        .balloon:nth-child(7) { left: 70%; animation-duration: 5s; }
        .balloon:nth-child(8) { left: 80%; animation-duration: 7s; }
        .balloon:nth-child(9) { left: 90%; animation-duration: 6s; }
        @keyframes balloon {
            0% { bottom: -100px; transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(20px) rotate(45deg); }
            100% { bottom: 100vh; transform: translateX(-20px) rotate(-45deg); }
        }
        .fireworks {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: firework 1s ease-out forwards;
        }
        @keyframes firework {
            0% { transform: scale(0); }
            100% { transform: scale(2); opacity: 0; }
        }
        .signup-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            background-color: #b8bbbe;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            display: inline-block;
        }
        .signup-link:hover {
            background-color: #0056b3;
        }
        .signup-link::before {
            content: '';
            display: inline-block;
            margin-right: 8px;
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 10px solid #ffffff;
        }
    </style>
</head>
<body>
    <h1>Successfully Logged In</h1>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>

    <canvas class="fireworks"></canvas>

    <a href="signup.html" class="signup-link">Go to Signup Page</a>

    <script>
        // Fireworks script
        const fireworksCanvas = document.querySelector('.fireworks');
        fireworksCanvas.width = window.innerWidth;
        fireworksCanvas.height = window.innerHeight;

        function createFirework(x, y) {
            for (let i = 0; i < 100; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = `${x}px`;
                firework.style.top = `${y}px`;
                document.body.appendChild(firework);
                setTimeout(() => {
                    firework.remove();
                }, 1000);
            }
        }

        function launchFirework() {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight / 2;
            createFirework(x, y);
        }

        setInterval(launchFirework, 100);
    </script>
</body>
</html>
